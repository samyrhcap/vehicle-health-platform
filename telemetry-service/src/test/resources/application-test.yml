spring:
  datasource:
    url: jdbc:h2:mem:telemetry_test_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    database-platform: org.hibernate.dialect.H2Dialect

    show-sql: false
    open-in-view: false

analysis:
  service:
    url: http://localhost:8082

logging:
  level:
    root: INFO