server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: vehicle-analysis-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vehicle_analysis_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

recall:
  provider:
    url: ${RECALL_PROVIDER_URL:http://localhost:9999}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.renault.analysis: DEBUG