server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: telemetry-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

analysis:
  service:
    url: ${ANALYSIS_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.renault.telemetry: DEBUG
